[package]
name = "atlas-http"
version = "0.2.7"
description = "Simple, straight forward, easy to use HTTP client."
edition = "2024"
authors = ["Aquila Labs"]
homepage = "https://cicero.sh/"
keywords = ["http", "hyper", "request", "postman", "download"]
categories = ["network-programming"] 
readme = "README.md"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/mdizak/rust-atlas-http"

[lib]
name = "atlas_http"

[dependencies]
base64 = "0.21.7"
mime_guess = "2.0.4"
rand = "0.8.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.36.0", features = ["net", "fs", "io-util"] }
tokio-rustls = "0.26.2"
url = "2.5.0"
urlencoding = "2.1.3"
webpki = "0.22.4"
webpki-roots = "0.26.0"


